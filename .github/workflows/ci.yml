name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Validate production Compose
        env:
          DATABASE_URL: postgresql://postgres.project:password@pooler.example.com:5432/postgres?sslmode=require
          GEMINI_API_KEY: ci-placeholder
          MASTERME_IMAGE: ghcr.io/example/masterme:ci
        run: docker compose -f deploy/compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: masterme-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
