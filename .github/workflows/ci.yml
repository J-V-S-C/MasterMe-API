name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = "main" ]; then
            test "$HEAD_BRANCH" = "development" || { echo "PRs para main devem vir de development."; exit 1; }
          elif [ "$BASE_BRANCH" = "development" ]; then
            case "$HEAD_BRANCH" in
              feat/*|fix/*|docs/*|chore/*|refactor/*|test/*|ci/*|perf/*|hotfix/*) ;;
              *) echo "Use uma branch feat/*, fix/*, docs/*, chore/*, refactor/*, test/*, ci/*, perf/* ou hotfix/*."; exit 1 ;;
            esac
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Validate production Compose
        env:
          DATABASE_URL: postgresql://postgres.project:password@pooler.example.com:5432/postgres?sslmode=require
          GEMINI_API_KEY: ci-placeholder
          MASTERME_IMAGE: ghcr.io/example/masterme:ci
          SUPABASE_URL: https://example.supabase.co
        run: docker compose -f deploy/compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: masterme-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
