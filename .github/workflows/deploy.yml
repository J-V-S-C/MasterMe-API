name: Deploy backend to OCI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install and validate backend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - id: image
        name: Normalize image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/masterme-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment manifest
        run: scp deploy/compose.yml "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}:/tmp/masterme-backend.compose.yml"
      - name: Deploy immutable image
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_DEPLOY_USER: ${{ github.actor }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" "docker login ghcr.io -u '$GHCR_DEPLOY_USER' --password-stdin"
          ssh "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" "sudo install -d -m 750 /opt/masterme && sudo mv /tmp/masterme-backend.compose.yml /opt/masterme/compose.yml && sudo chown -R '${{ secrets.OCI_SSH_USER }}' /opt/masterme"
          ssh "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" "cd /opt/masterme && MASTERME_IMAGE='$DEPLOY_IMAGE' docker compose --env-file .env -f compose.yml pull && MASTERME_IMAGE='$DEPLOY_IMAGE' docker compose --env-file .env -f compose.yml run --rm api bun run migrate && MASTERME_IMAGE='$DEPLOY_IMAGE' docker compose --env-file .env -f compose.yml up -d --remove-orphans"
          ssh "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" "curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:3333/health"
