services:
  api:
    image: ${MASTERME_IMAGE:?Configure MASTERME_IMAGE}
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 256
    environment: &backend-environment
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?Configure a Session pooler URL do Supabase}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Configure GEMINI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACKS: ${GEMINI_MODEL_FALLBACKS:-gemini-3.5-flash}
      EXTRACTION_MAX_CONCEPTS: ${EXTRACTION_MAX_CONCEPTS:-12}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-1}
      MATERIAL_STORAGE_PATH: /app/data/materials
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - material_uploads:/app/data/materials

  worker:
    image: ${MASTERME_IMAGE:?Configure MASTERME_IMAGE}
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    command: ["bun", "server.ts", "--worker"]
    environment: *backend-environment
    volumes:
      - material_uploads:/app/data/materials

volumes:
  material_uploads:
