services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socratic_game
      POSTGRES_USER: socratic
      POSTGRES_PASSWORD: socratic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socratic -d socratic_game"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://socratic:socratic@db:5432/socratic_game
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Configure GEMINI_API_KEY no ambiente}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACKS: ${GEMINI_MODEL_FALLBACKS:-gemini-3.5-flash,gemini-3.6-flash}
      EXTRACTION_MAX_CONCEPTS: ${EXTRACTION_MAX_CONCEPTS:-12}
      MATERIAL_STORAGE_PATH: /app/data/materials
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-3}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - material_uploads:/app/data/materials

  worker:
    build: .
    command: ["bun", "server.ts", "--worker"]
    environment:
      DATABASE_URL: postgresql://socratic:socratic@db:5432/socratic_game
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Configure GEMINI_API_KEY no ambiente}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACKS: ${GEMINI_MODEL_FALLBACKS:-gemini-3.5-flash,gemini-3.6-flash}
      EXTRACTION_MAX_CONCEPTS: ${EXTRACTION_MAX_CONCEPTS:-12}
      MATERIAL_STORAGE_PATH: /app/data/materials
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-3}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - material_uploads:/app/data/materials

volumes:
  postgres_data:
  material_uploads:
