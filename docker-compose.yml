services:
  api:
    build: .
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 256
    environment:
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?Configure a Session pooler URL do Supabase}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Configure GEMINI_API_KEY no ambiente}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACKS: ${GEMINI_MODEL_FALLBACKS:-gemini-3.5-flash}
      EXTRACTION_MAX_CONCEPTS: ${EXTRACTION_MAX_CONCEPTS:-12}
      MATERIAL_STORAGE_PATH: /app/data/materials
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-1}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-100}
      AI_CREDITS_ENABLED: ${AI_CREDITS_ENABLED:-true}
      AI_GLOBAL_DAILY_CREDIT_LIMIT: ${AI_GLOBAL_DAILY_CREDIT_LIMIT:-20000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      INFINITEPAY_HANDLE: ${INFINITEPAY_HANDLE:-}
      INFINITEPAY_TIMEOUT_MS: ${INFINITEPAY_TIMEOUT_MS:-5000}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      OBSERVABILITY_DB_TIMEOUT_MS: ${OBSERVABILITY_DB_TIMEOUT_MS:-1000}
    ports:
      - "3333:3333"
    volumes:
      - material_uploads:/app/data/materials

  worker:
    build: .
    command: ["bun", "server.ts", "--worker"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure a Session pooler URL do Supabase}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Configure GEMINI_API_KEY no ambiente}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACKS: ${GEMINI_MODEL_FALLBACKS:-gemini-3.5-flash}
      EXTRACTION_MAX_CONCEPTS: ${EXTRACTION_MAX_CONCEPTS:-12}
      MATERIAL_STORAGE_PATH: /app/data/materials
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-1}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-100}
      AI_CREDITS_ENABLED: ${AI_CREDITS_ENABLED:-true}
      AI_GLOBAL_DAILY_CREDIT_LIMIT: ${AI_GLOBAL_DAILY_CREDIT_LIMIT:-20000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      INFINITEPAY_HANDLE: ${INFINITEPAY_HANDLE:-}
      INFINITEPAY_TIMEOUT_MS: ${INFINITEPAY_TIMEOUT_MS:-5000}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      OBSERVABILITY_DB_TIMEOUT_MS: ${OBSERVABILITY_DB_TIMEOUT_MS:-1000}
    volumes:
      - material_uploads:/app/data/materials

volumes:
  material_uploads:
